[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-process-engine"
version = "0.1.0"
description = "OT-oriented industrial process and product data engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Kristjan Cuznar"}]
keywords = ["industrial", "OT", "MQTT", "OPC UA", "QuestDB", "manufacturing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115,<1",
    "asyncua>=2.0,<3",
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "questdb>=5.0,<6",
    "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/CuAuPro/industrial-process-engine"
Issues = "https://github.com/CuAuPro/industrial-process-engine/issues"

[project.scripts]
industrial-process-engine = "industrial_process_engine.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "twine>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["industrial_process_engine*"]
exclude = ["industrial_process_engine.tests*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"industrial_process_engine" = [
    "templates/basic/*", "templates/basic/config/*",
    "templates/basic/application/*", "templates/basic/tests/*",
    "templates/basic/.gitignore", "templates/basic/.dockerignore",
    "templates/basic/.env.example",
]
"industrial_process_engine.simulators" = ["*.yaml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["industrial_process_engine/tests"]
addopts = "-q -p industrial_process_engine.tests.fixtures"
